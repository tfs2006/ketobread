<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Store-bought keto bread label check card</title>
  <desc id="desc">A branded vertical SVG card with a checklist for evaluating store-bought keto bread labels and ingredient quality.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282019"/>
      <stop offset="58%" stop-color="#6c593e"/>
      <stop offset="100%" stop-color="#d7b578"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="72" y="72" width="936" height="1776" rx="50" fill="#f9f5ee"/>
  <circle cx="866" cy="232" r="166" fill="#fff9ef" opacity="0.09"/>

  <rect x="120" y="118" width="346" height="58" rx="29" fill="#6b583d"/>
  <text x="293" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#f8f4ee" letter-spacing="2">BUYING CHECKLIST</text>

  <text x="120" y="262" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#30261d">Store-Bought Keto</text>
  <text x="120" y="344" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#30261d">Bread Label Check</text>
  <text x="120" y="418" font-family="Arial, sans-serif" font-size="32" fill="#63594f">
    <tspan x="120" dy="0">A quick saveable screen for shoppers</tspan>
    <tspan x="120" dy="38">who want fewer disappointments.</tspan>
  </text>

  <g transform="translate(860 296) scale(0.74)">
    <rect x="26" y="48" width="186" height="210" rx="24" fill="#fff4dc"/>
    <rect x="60" y="96" width="116" height="18" rx="9" fill="#d3b180"/>
    <rect x="60" y="132" width="116" height="18" rx="9" fill="#d3b180"/>
    <rect x="60" y="168" width="78" height="18" rx="9" fill="#d3b180"/>
    <path d="M70 74l22 22 36-42" fill="none" stroke="#6b583d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="120" y="500" width="840" height="166" rx="28" fill="#f0e8da" stroke="#ddd0bb"/>
  <text x="160" y="544" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#8a6b31">BEST USE</text>
  <text x="160" y="584" font-family="Arial, sans-serif" font-size="31" fill="#342b23">
    <tspan x="160" dy="0">Use this when the package says keto, low-carb,</tspan>
    <tspan x="160" dy="38">or high-protein but you want a better read</tspan>
    <tspan x="160" dy="38">than front-label hype.</tspan>
  </text>

  <g font-family="Arial, sans-serif" font-size="34" fill="#2f261f">
    <rect x="120" y="700" width="840" height="96" rx="24" fill="#fffdfa" stroke="#e0d6c8"/>
    <text x="154" y="754" font-size="31">
      <tspan x="154" dy="0">Check net carbs and</tspan>
      <tspan x="154" dy="34">serving size together</tspan>
    </text>
    <text x="912" y="760" text-anchor="end" fill="#5d7a3f">keep</text>

    <rect x="120" y="820" width="840" height="96" rx="24" fill="#fffdfa" stroke="#e0d6c8"/>
    <text x="154" y="874" font-size="29">
      <tspan x="154" dy="0">Look for texture support like</tspan>
      <tspan x="154" dy="32">seeds, fiber, or structure</tspan>
    </text>
    <text x="912" y="880" text-anchor="end" fill="#5d7a3f">keep</text>

    <rect x="120" y="940" width="840" height="96" rx="24" fill="#fffdfa" stroke="#e0d6c8"/>
    <text x="154" y="994" font-size="31">
      <tspan x="154" dy="0">Watch for sweetness if</tspan>
      <tspan x="154" dy="34">you want sandwich bread</tspan>
    </text>
    <text x="912" y="1000" text-anchor="end" fill="#5d7a3f">keep</text>

    <rect x="120" y="1060" width="840" height="96" rx="24" fill="#fffdfa" stroke="#e0d6c8"/>
    <text x="154" y="1114" font-size="31">
      <tspan x="154" dy="0">Avoid labels that hide tiny slices behind</tspan>
      <tspan x="154" dy="34">great macros</tspan>
    </text>
    <text x="912" y="1120" text-anchor="end" fill="#b5523f">watch</text>

    <rect x="120" y="1180" width="840" height="96" rx="24" fill="#fffdfa" stroke="#e0d6c8"/>
    <text x="154" y="1234" font-size="30">
      <tspan x="154" dy="0">If it tastes like dessert,</tspan>
      <tspan x="154" dy="34">it will not replace toast well</tspan>
    </text>
    <text x="912" y="1240" text-anchor="end" fill="#b5523f">watch</text>
  </g>

  <text x="120" y="1406" font-family="Georgia, serif" font-size="50" font-weight="700" fill="#30261d">The Real Question</text>
  <text x="120" y="1458" font-family="Arial, sans-serif" font-size="29" fill="#2f261f">
    <tspan x="120" dy="0">Would you want to eat two slices of it plain,</tspan>
    <tspan x="120" dy="36">toasted, or in a sandwich?</tspan>
    <tspan x="120" dy="36">If not, the label is not enough.</tspan>
  </text>

  <rect x="120" y="1560" width="840" height="178" rx="28" fill="#2f261f"/>
  <text x="160" y="1598" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f0cb8a">TRUST SIGNAL</text>
  <text x="160" y="1640" font-family="Arial, sans-serif" font-size="28" fill="#fff8ef">
    <tspan x="160" dy="0">The best store-bought keto bread still has to win</tspan>
    <tspan x="160" dy="34">on texture, not just macros.</tspan>
    <tspan x="160" dy="34">A package cannot rescue cardboard.</tspan>
  </text>

  <rect x="72" y="1748" width="936" height="100" fill="#221b15"/>
  <text x="120" y="1807" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#fff8ef">ketobread.4ourmedia.com</text>
  <text x="956" y="1807" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#efce8d">SHOP SMARTER</text>
</svg>